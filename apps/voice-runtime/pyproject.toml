[project]
name = "callflow-voice-runtime"
version = "0.1.0"
description = "The worker that holds a CallFlow conversation inside a LiveKit room"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

# Every STT/TTS/LLM vendor is optional. The pipeline imports a plugin only when
# a voice agent actually asks for that provider (see `pipeline.py`), so a
# deployment installs the vendors its organisations use and nothing else -
# `livekit-agents` pulls in a large dependency tree per plugin.
[project.optional-dependencies]
sarvam = ["livekit-plugins-sarvam>=1.0.0"]
openai = ["livekit-agents[openai]>=1.0.0"]
deepgram = ["livekit-plugins-deepgram>=1.0.0"]
elevenlabs = ["livekit-plugins-elevenlabs>=1.0.0"]
silero = ["livekit-plugins-silero>=1.0.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PYI"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
