<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon variant of the mark. The geometry is thickened for small sizes: at
       16px the three lamps merge into a readable tri-colour bar, which is exactly
       what the mark is meant to do at this scale.

       A static SVG cannot read a token, so these five values mirror `--dark-*`
       from globals.css via lib/brand-assets.ts. scripts/check-tokens.mjs fails
       the build if they drift apart, which is how they got three versions behind
       in the first place. -->
  <rect width="32" height="32" rx="7" fill="#141419"/>
  <rect x="4.5" y="11" width="23" height="10" rx="5" fill="none" stroke="#48484c" stroke-width="1.5"/>
  <circle cx="11" cy="16" r="3.2" fill="#4b9073"/>
  <circle cx="16" cy="16" r="3.2" fill="#a47f47"/>
  <circle cx="21" cy="16" r="3.2" fill="#c15f4d"/>
</svg>
