[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Revision filenames sort chronologically, which makes the versions directory
# readable without opening anything.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is intentionally absent - env.py reads DATABASE_URL so a
# connection string never lands in a tracked file.

# post_write_hooks are deliberately absent: they require ruff on PATH, which
# is not true inside a venv-only setup. Formatting is enforced by CI instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
