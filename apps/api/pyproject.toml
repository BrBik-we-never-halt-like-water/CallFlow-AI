[project]
name = "callflow"
version = "0.1.0"
description = "An operations layer for outbound phone calls"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "livekit-api>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "SQLAlchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    # The `[webhooks]` extra is not optional for us: it pulls in
    # `standardwebhooks`, and without it `client.webhooks.unwrap` raises
    # "You need to install dodopayments[webhooks]" on *every* delivery. Installing
    # plain `dodopayments` produced an API that rejected every genuine webhook as
    # unverified - a dependency problem wearing an authentication problem's clothes.
    "dodopayments[webhooks]>=1.112.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
