# Render blueprint for CallFlow AI — backend API + Next.js dashboard.
#
# Secrets are NOT stored here. Anything marked `sync: false` must be set in the
# Render dashboard under each service's Environment tab.

services:
  # ---------------------------------------------------------------- backend --
  - type: web
    name: callflow-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -e .
    startCommand: uvicorn callflow.api:app --host 0.0.0.0 --port $PORT
    # `/` is the cheapest route and never touches config or locks, so a slow
    # health check can never take the service down.
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Set in the dashboard, never in this file.
      - key: CALLE_API_KEY
        sync: false

      # Comma-separated E.164 numbers that may be dialed. Keep this set.
      - key: CALLFLOW_ALLOWLIST
        sync: false

      # The dashboard's public URL is wired in automatically once it deploys.
      - key: CALLFLOW_CORS_ORIGINS
        fromService:
          name: callflow-web
          type: web
          property: host

      # Visitors may place live calls to their own number, so the allowlist is
      # left unset in production. Rate limits below are what protect the
      # credit balance — do not remove them.
      #
      # This is only the DEFAULT for API calls that omit `dry_run`. The
      # dashboard always sends it explicitly, and starts on Dry run, so a
      # visitor has to deliberately switch to Live before anything dials.
      - key: CALLFLOW_DRY_RUN
        value: "true"

      - key: CALLFLOW_MAX_CALLS_PER_RUN
        value: "3"

      # Per-IP allowance, then a shared daily floor.
      - key: CALLFLOW_RATE_LIMIT_CALLS
        value: "2"

      - key: CALLFLOW_RATE_LIMIT_WINDOW
        value: "3600"

      - key: CALLFLOW_DAILY_BUDGET
        value: "20"

      # Secret that lifts the limits for the owner. Set in the dashboard.
      - key: CALLFLOW_OWNER_KEY
        generateValue: true

      - key: CALLE_DEFAULT_REGION
        value: IN

      - key: CALLE_DEFAULT_LANGUAGE
        value: en

  # --------------------------------------------------------------- frontend --
  - type: web
    name: callflow-web
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.19.5"

      # Points the dashboard at the API above. Resolved by Render at deploy time.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: callflow-api
          type: web
          property: host
