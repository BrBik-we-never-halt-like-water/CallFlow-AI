name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: callflow-ai-${{ github.ref }}
  # Cancel superseded PR checks, but never a push. Cancelling a push can kill
  # `alembic upgrade head` between two migrations and leave the schema halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests

      # Two branches that each add a migration merge cleanly and leave two heads.
      # `alembic upgrade head` then fails on the VM, against a real database.
      # `heads` reads alembic/versions only - it never executes env.py and never
      # opens a connection - so this catches it here for free.
      - name: Exactly one migration head
        run: |
          count=$(alembic heads | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected 1 migration head, found $count:"
            alembic heads
            echo "Resolve with: alembic merge -m 'merge heads' <rev> <rev>"
            exit 1
          fi

      - run: pytest -q

  web:
    name: Web lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://callflow-ai.brbik.com

  # ---------------------------------------------------------------------------
  # Three deployment jobs, one per thing that can independently go wrong: the
  # machine, the schema, the code. Each is separately visible and separately
  # re-runnable, so a failed migration is a red `migrate`, not something buried
  # in the middle of a deploy log.
  #
  # All three resolve `environment` from the branch name, so main and dev supply
  # their own APP_DIR / PUBLIC_URL / VM_* / ENV_FILE_B64 and no job holds an
  # environment literal.
  # ---------------------------------------------------------------------------

  provision:
    name: Provision ${{ github.ref_name }}
    needs: [api, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      APP_DIR: ${{ vars.APP_DIR }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      # An unset var would otherwise deploy this branch into whatever directory
      # the other environment uses.
      - name: Check the environment is configured
        run: |
          test -n "$APP_DIR"    || { echo "APP_DIR is not set for environment '$BRANCH'";    exit 1; }
          test -n "$PUBLIC_URL" || { echo "PUBLIC_URL is not set for environment '$BRANCH'"; exit 1; }

      - name: Bring the VM to the expected state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          envs: BRANCH,APP_DIR,PUBLIC_URL,CALLFLOW_ENV,REPO_URL,ENV_FILE_B64,WEB_ENV_FILE_B64,ORIGIN_CERT_B64,ORIGIN_KEY_B64,CERTBOT_EMAIL
          script: |
            set -euo pipefail

            # The clone is inline rather than in bootstrap.sh for the obvious
            # reason: on a bare machine the script does not exist yet.
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> cloning $BRANCH into $APP_DIR"
              if [ ! -d "$APP_DIR" ]; then
                # sudo -n: this session has no tty, so an unconfigured sudo
                # must fail rather than sit waiting for a password.
                mkdir -p "$APP_DIR" 2>/dev/null \
                  || { sudo -n mkdir -p "$APP_DIR" && sudo -n chown "$(id -u):$(id -g)" "$APP_DIR"; }
              fi
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # An existing checkout may point at git@github.com from before this
            # was automated, which fails on a machine with no key. The pipeline
            # owns this directory, so normalise the remote rather than depending
            # on how it happened to be cloned.
            git remote set-url origin "$REPO_URL"
            git fetch --prune origin
            # checkout -B rather than `git pull`: pins the checkout to the branch
            # being deployed instead of trusting whatever it was left on.
            git checkout -B "$BRANCH" "origin/$BRANCH"

            for required in apps/api apps/web scripts/bootstrap.sh; do
              [ -e "$required" ] || { echo "FATAL: $required missing."; exit 1; }
            done

            bash scripts/bootstrap.sh
        env:
          CALLFLOW_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          # HTTPS, not SSH: the repo is public, so the VM needs no key, no deploy
          # key and no credential of any kind to read it. Override with a REPO_URL
          # variable if it ever goes private.
          REPO_URL: ${{ vars.REPO_URL || 'https://github.com/BrBik-we-never-halt-like-water/CallFlow-AI.git' }}
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
          WEB_ENV_FILE_B64: ${{ secrets.WEB_ENV_FILE_B64 }}
          ORIGIN_CERT_B64: ${{ secrets.ORIGIN_CERT_B64 }}
          ORIGIN_KEY_B64: ${{ secrets.ORIGIN_KEY_B64 }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}

  migrate:
    name: Migrate ${{ github.ref_name }}
    needs: [provision]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - name: alembic upgrade head
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          envs: APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR/apps/api"

            # alembic.ini sets script_location and prepend_sys_path to `.`, and
            # alembic resolves both against the working directory - so this has
            # to run from apps/api. Running it from the repo root with -c finds
            # no migrations and silently upgrades nothing.
            "$APP_DIR/.venv/bin/alembic" current
            "$APP_DIR/.venv/bin/alembic" upgrade head
            "$APP_DIR/.venv/bin/alembic" current

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: [migrate]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      APP_DIR: ${{ vars.APP_DIR }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Build and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          envs: BRANCH,APP_DIR,PUBLIC_URL
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # dev runs beside prod on its own pm2 apps and ports. Derived here
            # rather than in a workflow expression, where an empty string is
            # falsy: the obvious `== 'main' && '' || '-dev'` hands main the dev
            # suffix.
            if [ "$BRANCH" = "main" ]; then SUFFIX=""; else SUFFIX="-dev"; fi
            if [ "$BRANCH" = "main" ]; then export CALLFLOW_ENV=production; else export CALLFLOW_ENV=dev; fi

            # startOrRestart, not restart: the first deploy into a fresh
            # directory has no pm2 process to restart yet, and the definition
            # lives in the repo rather than in whatever someone typed once.
            pm2 startOrRestart "$APP_DIR/ecosystem.config.js" \
              --only "callflow-api$SUFFIX" --update-env

            cd apps/web

            # `npm ci` deletes node_modules and reinstalls ~600 packages, which
            # is most of this job's runtime and pure waste on the deploys where
            # no dependency moved. Keyed on the lockfile's hash rather than its
            # mtime, because a fresh checkout rewrites mtimes on every deploy.
            # ci, not install, when it does run - the lockfile stays authoritative.
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ ! -d node_modules ] || [ "$(cat .lock-hash 2>/dev/null)" != "$LOCK_HASH" ]; then
              echo "==> dependencies changed, running npm ci"
              npm ci
              echo "$LOCK_HASH" > .lock-hash
            else
              echo "==> dependencies unchanged, skipping npm ci"
            fi

            NEXT_PUBLIC_API_URL="$PUBLIC_URL" npm run build
            pm2 startOrRestart "$APP_DIR/ecosystem.config.js" \
              --only "callflow-web$SUFFIX" --update-env

            # Records the process list so the systemd unit has something to replay.
            pm2 save

      - name: Health check
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$PUBLIC_URL/api/health"
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused -o /dev/null "$PUBLIC_URL/"
