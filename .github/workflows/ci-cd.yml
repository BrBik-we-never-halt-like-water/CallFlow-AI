name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: callflow-ai-${{ github.ref }}
  # Cancel superseded PR checks, but never a push. Cancelling a push can kill
  # `alembic upgrade head` between two migrations and leave the schema halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Which half of the monorepo actually changed.
  #
  # The api and web halves are deployed independently below, so most pushes only
  # need one of them. A web-only change should not pay for `alembic upgrade head`
  # against a real database, and an api-only change should not pay for the web
  # build twice (once here, once on the VM) - that pair is where the wall-clock
  # actually goes: web checks are ~66s and the VM's own `npm ci && npm run build`
  # is most of the deploy's ~60s.
  #
  # Fail-OPEN, deliberately, and the opposite of how the product's own safety
  # gates work: when this cannot tell what changed - a new branch with no `before`
  # commit, a force-push whose base is gone, anything touching a shared file -
  # it reports BOTH as changed and everything runs. A wrongly-skipped deploy
  # ships a half-updated VM, which is far worse than a wasted minute. Detection
  # being uncertain is not a reason to deploy less.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      voice: ${{ steps.filter.outputs.voice }}
    steps:
      # No `actions/checkout`, deliberately. This job sits on the critical path
      # of every run, so it has to be cheap or it eats the time the filtering
      # saves - cloning the repo just to run `git diff` costs more than the
      # `migrate` job it lets us skip. The compare API answers the same question
      # without a working tree, and `gh` is preinstalled on the runner.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail

          everything() {
            echo "$1"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "voice=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A first push to a branch reports an all-zero `before`, and a
          # force-pushed base may no longer be reachable.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) everything "No usable base commit - running everything." ;;
          esac

          changed=$(gh api --paginate \
            "repos/${{ github.repository }}/compare/$BASE...${{ github.sha }}" \
            --jq '.files[].filename' 2>/dev/null) \
            || everything "Could not compare $BASE...${{ github.sha }} - running everything."

          if [ -z "$changed" ]; then
            everything "No file diff resolved - running everything."
          fi

          # The compare endpoint caps `files` at 300 and does not paginate that
          # array. A truncated list could omit the very files that should have
          # triggered the other half, so at the cap we stop trusting it.
          count=$(printf '%s\n' "$changed" | grep -c .)
          if [ "$count" -ge 300 ]; then
            everything "File list hit the compare API's 300-file cap - running everything."
          fi

          echo "Changed files ($count):"
          printf '%s\n' "$changed" | sed 's/^/  /'

          api=false
          web=false
          voice=false
          # Anything outside the three app directories is shared - the workflow
          # itself, ecosystem.config.js, the bootstrap scripts, the root
          # package.json - and any of them can change how ALL of them deploy.
          #
          # The voice runtime deploys to its own VM (see the deployment section
          # below), so it gets its own flag rather than falling through to the
          # catch-all: without this, every worker change also rebuilt the web
          # app and re-ran migrations on a box it never touches.
          while IFS= read -r f; do
            case "$f" in
              apps/api/*)           api=true ;;
              apps/web/*)           web=true ;;
              apps/voice-runtime/*) voice=true ;;
              *)                    api=true; web=true; voice=true ;;
            esac
          done <<< "$changed"

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "voice=$voice" >> "$GITHUB_OUTPUT"
          echo "Result: api=$api web=$web voice=$voice"

  api:
    name: API lint & tests
    needs: [changes]
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests

      # Two branches that each add a migration merge cleanly and leave two heads.
      # `alembic upgrade head` then fails on the VM, against a real database.
      # `heads` reads alembic/versions only - it never executes env.py and never
      # opens a connection - so this catches it here for free.
      - name: Exactly one migration head
        run: |
          count=$(alembic heads | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected 1 migration head, found $count:"
            alembic heads
            echo "Resolve with: alembic merge -m 'merge heads' <rev> <rev>"
            exit 1
          fi

      - run: pytest -q

  voice:
    name: Voice runtime lint & tests
    needs: [changes]
    if: ${{ needs.changes.outputs.voice == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # No extras: the plugin factories import lazily (app/pipeline.py), so the
      # registry and the worker are testable with no vendor package present -
      # which is the point of that design and worth holding CI to.
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q

  web:
    name: Web lint, type-check, build
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
        env:
          # Only has to be a valid absolute URL: this job proves the build
          # compiles, and the deployed build sets NEXT_PUBLIC_API_URL from
          # the per-environment `vars.PUBLIC_URL` instead (see deploy-web),
          # so dev builds against dev and main against main.
          NEXT_PUBLIC_API_URL: https://calllflow.com

  # ---------------------------------------------------------------------------
  # Deployment: one shared provision, then two independent chains.
  #
  #   provision ─┬─ migrate ─ deploy-api      (schema, then the FastAPI process)
  #              └─ deploy-web                (the Next build + its own process)
  #
  # The two chains are genuinely independent past provision and run in parallel:
  # the web build no longer waits behind `alembic upgrade head`, and the API
  # restart no longer waits behind a Next build it has nothing to do with.
  # `provision` stays shared and stays first because both halves deploy out of
  # ONE checkout on ONE VM - it is what puts the right commit there, and running
  # two `git checkout -B` against the same directory concurrently is a race.
  #
  # Each job is still separately visible and separately re-runnable, so a failed
  # migration is a red `migrate` rather than something buried in a deploy log.
  #
  # All of them resolve `environment` from the branch name, so main and dev
  # supply their own APP_DIR / PUBLIC_URL / VM_* / ENV_FILE_B64 and no job holds
  # an environment literal.
  #
  # The `!cancelled() && ... != 'failure'` guard on each: a *skipped* dependency
  # would otherwise skip everything downstream of it, which is exactly what
  # happens on a web-only push where the `api` job never ran.
  # ---------------------------------------------------------------------------

  provision:
    name: Provision ${{ github.ref_name }}
    needs: [changes, api, web]
    if: >-
      ${{ github.event_name == 'push'
          && !cancelled()
          && needs.api.result != 'failure'
          && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      APP_DIR: ${{ vars.APP_DIR }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      # An unset var would otherwise deploy this branch into whatever directory
      # the other environment uses.
      - name: Check the environment is configured
        run: |
          test -n "$APP_DIR"    || { echo "APP_DIR is not set for environment '$BRANCH'";    exit 1; }
          test -n "$PUBLIC_URL" || { echo "PUBLIC_URL is not set for environment '$BRANCH'"; exit 1; }

      - name: Bring the VM to the expected state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          envs: BRANCH,APP_DIR,PUBLIC_URL,CALLFLOW_ENV,REPO_URL,ENV_FILE_B64,WEB_ENV_FILE_B64,ORIGIN_CERT_B64,ORIGIN_KEY_B64,CERTBOT_EMAIL,VOICE_VM_HOST
          script: |
            set -euo pipefail

            # The clone is inline rather than in bootstrap.sh for the obvious
            # reason: on a bare machine the script does not exist yet.
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> cloning $BRANCH into $APP_DIR"
              if [ ! -d "$APP_DIR" ]; then
                # sudo -n: this session has no tty, so an unconfigured sudo
                # must fail rather than sit waiting for a password.
                mkdir -p "$APP_DIR" 2>/dev/null \
                  || { sudo -n mkdir -p "$APP_DIR" && sudo -n chown "$(id -u):$(id -g)" "$APP_DIR"; }
              fi
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # An existing checkout may point at git@github.com from before this
            # was automated, which fails on a machine with no key. The pipeline
            # owns this directory, so normalise the remote rather than depending
            # on how it happened to be cloned.
            git remote set-url origin "$REPO_URL"
            git fetch --prune origin
            # The build writes into the checkout (Next.js regenerates
            # `next-env.d.ts` on every run), so a tracked file can be dirty
            # here through no fault of the commit being deployed - and
            # `git checkout` then refuses outright with "local changes would
            # be overwritten", failing the deploy until someone SSHes in.
            # This directory is owned by the pipeline and holds nothing worth
            # keeping between runs, so discard local state rather than
            # letting build output veto a deploy.
            git reset --hard HEAD
            # `-e` exclusions are belt-and-braces: bootstrap.sh rewrites both
            # env files from secrets after this runs, so cleaning them would
            # recover - but a deploy should not depend on that ordering to
            # avoid blowing away the running config.
            git clean -fd -e node_modules -e .venv -e .next -e .env -e apps/web/.env.local
            # checkout -B rather than `git pull`: pins the checkout to the branch
            # being deployed instead of trusting whatever it was left on.
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # `reset --hard` again *after* the checkout: the first one cleaned
            # the old branch's state, this one guarantees the tree matches the
            # commit actually being deployed.
            git reset --hard "origin/$BRANCH"

            for required in apps/api apps/web scripts/bootstrap.sh; do
              [ -e "$required" ] || { echo "FATAL: $required missing."; exit 1; }
            done

            bash scripts/bootstrap.sh
        env:
          CALLFLOW_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          # HTTPS, not SSH: the repo is public, so the VM needs no key, no deploy
          # key and no credential of any kind to read it. Override with a REPO_URL
          # variable if it ever goes private.
          REPO_URL: ${{ vars.REPO_URL || 'https://github.com/BrBik-we-never-halt-like-water/CallFlow-AI.git' }}
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
          WEB_ENV_FILE_B64: ${{ secrets.WEB_ENV_FILE_B64 }}
          ORIGIN_CERT_B64: ${{ secrets.ORIGIN_CERT_B64 }}
          ORIGIN_KEY_B64: ${{ secrets.ORIGIN_KEY_B64 }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
          # Not for this VM to use - it is the address nginx here will allow to
          # reach /internal/, which is the only door the voice VM knocks on.
          VOICE_VM_HOST: ${{ vars.VOICE_VM_HOST }}

  # ---- API chain -------------------------------------------------------------

  migrate:
    name: Migrate ${{ github.ref_name }}
    needs: [changes, provision]
    if: >-
      ${{ needs.changes.outputs.api == 'true'
          && !cancelled()
          && needs.provision.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      APP_DIR: ${{ vars.APP_DIR }}
    steps:
      - name: alembic upgrade head
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          envs: APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR/apps/api"

            # alembic.ini sets script_location and prepend_sys_path to `.`, and
            # alembic resolves both against the working directory - so this has
            # to run from apps/api. Running it from the repo root with -c finds
            # no migrations and silently upgrades nothing.
            "$APP_DIR/.venv/bin/alembic" current
            "$APP_DIR/.venv/bin/alembic" upgrade head
            "$APP_DIR/.venv/bin/alembic" current

  deploy-api:
    name: Deploy API ${{ github.ref_name }}
    needs: [changes, migrate]
    if: >-
      ${{ needs.changes.outputs.api == 'true'
          && !cancelled()
          && needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      APP_DIR: ${{ vars.APP_DIR }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Restart the API process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          envs: BRANCH,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # dev runs beside prod on its own pm2 apps and ports. Derived here
            # rather than in a workflow expression, where an empty string is
            # falsy: the obvious `== 'main' && '' || '-dev'` hands main the dev
            # suffix.
            if [ "$BRANCH" = "main" ]; then SUFFIX=""; else SUFFIX="-dev"; fi
            if [ "$BRANCH" = "main" ]; then export CALLFLOW_ENV=production; else export CALLFLOW_ENV=dev; fi

            # startOrRestart, not restart: the first deploy into a fresh
            # directory has no pm2 process to restart yet, and the definition
            # lives in the repo rather than in whatever someone typed once.
            pm2 startOrRestart "$APP_DIR/ecosystem.config.js" \
              --only "callflow-api$SUFFIX" --update-env

            # Records the process list so the systemd unit has something to replay.
            pm2 save

      - name: Health check
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$PUBLIC_URL/api/health"

  # ---- Web chain -------------------------------------------------------------
  #
  # Depends on `provision` only, never on `migrate` - a Next build has no
  # relationship to the database schema, and waiting behind it was pure serial
  # time. Runs concurrently with the whole API chain above.

  deploy-web:
    name: Deploy web ${{ github.ref_name }}
    needs: [changes, provision]
    if: >-
      ${{ needs.changes.outputs.web == 'true'
          && !cancelled()
          && needs.provision.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      APP_DIR: ${{ vars.APP_DIR }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Build and restart the web process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          envs: BRANCH,APP_DIR,PUBLIC_URL
          script: |
            set -euo pipefail
            cd "$APP_DIR/apps/web"

            if [ "$BRANCH" = "main" ]; then SUFFIX=""; else SUFFIX="-dev"; fi
            if [ "$BRANCH" = "main" ]; then export CALLFLOW_ENV=production; else export CALLFLOW_ENV=dev; fi

            NEXT_PUBLIC_API_URL="$PUBLIC_URL" npm ci
            NEXT_PUBLIC_API_URL="$PUBLIC_URL" npm run build
            pm2 startOrRestart "$APP_DIR/ecosystem.config.js" \
              --only "callflow-web$SUFFIX" --update-env

            pm2 save

      - name: Health check
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused -o /dev/null "$PUBLIC_URL/"

  # ---- Voice chain -------------------------------------------------------------
  #
  # A different VM entirely (vars.VOICE_VM_HOST), so this chain shares nothing
  # with the two above except the SSH credentials - not the checkout, not the
  # .venv, not the pm2 daemon. It therefore does not go through `provision`, and
  # a failing API deploy does not hold it back.
  #
  # No `migrate` step: the worker never opens a database connection. It reports
  # a finished call to the API over HTTP (`/internal/v1/...`), which is the only
  # thing on this box that talks to CallFlow at all.

  provision-voice:
    name: Provision voice ${{ github.ref_name }}
    needs: [changes, voice]
    if: >-
      ${{ github.event_name == 'push'
          && needs.changes.outputs.voice == 'true'
          && !cancelled()
          && needs.voice.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      VOICE_APP_DIR: ${{ vars.VOICE_APP_DIR }}
      VOICE_VM_HOST: ${{ vars.VOICE_VM_HOST }}
    steps:
      # Same reasoning as the API's own check: an unset var would deploy this
      # branch into whatever directory - or onto whatever host - the other
      # environment uses.
      - name: Check the environment is configured
        run: |
          test -n "$VOICE_APP_DIR" || { echo "VOICE_APP_DIR is not set for environment '$BRANCH'"; exit 1; }
          test -n "$VOICE_VM_HOST" || { echo "VOICE_VM_HOST is not set for environment '$BRANCH'"; exit 1; }

      - name: Bring the voice VM to the expected state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VOICE_VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 20m
          envs: BRANCH,VOICE_APP_DIR,CALLFLOW_ENV,REPO_URL,VOICE_ENV_FILE_B64,VOICE_EXTRAS
          script: |
            set -euo pipefail

            # Inline for the same reason as the API's: on a bare machine
            # scripts/bootstrap-voice.sh does not exist yet.
            if [ ! -d "$VOICE_APP_DIR/.git" ]; then
              echo "==> cloning $BRANCH into $VOICE_APP_DIR"
              if [ ! -d "$VOICE_APP_DIR" ]; then
                mkdir -p "$VOICE_APP_DIR" 2>/dev/null \
                  || { sudo -n mkdir -p "$VOICE_APP_DIR" && sudo -n chown "$(id -u):$(id -g)" "$VOICE_APP_DIR"; }
              fi
              git clone --branch "$BRANCH" "$REPO_URL" "$VOICE_APP_DIR"
            fi

            cd "$VOICE_APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --prune origin
            git checkout -B "$BRANCH" "origin/$BRANCH"

            for required in apps/voice-runtime ecosystem.config.js scripts/bootstrap-voice.sh; do
              [ -e "$required" ] || { echo "FATAL: $required missing."; exit 1; }
            done

            bash scripts/bootstrap-voice.sh
        env:
          CALLFLOW_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          REPO_URL: ${{ vars.REPO_URL || 'https://github.com/BrBik-we-never-halt-like-water/CallFlow-AI.git' }}
          VOICE_ENV_FILE_B64: ${{ secrets.VOICE_ENV_FILE_B64 }}
          VOICE_EXTRAS: ${{ vars.VOICE_EXTRAS }}

  deploy-voice:
    name: Deploy voice ${{ github.ref_name }}
    needs: [changes, provision-voice]
    # Bracket notation, not `needs.provision-voice`: a hyphen in a job id is
    # parsed as subtraction in a GitHub expression, so the dotted form silently
    # evaluates to nothing and the guard never holds.
    if: >-
      ${{ needs.changes.outputs.voice == 'true'
          && !cancelled()
          && needs['provision-voice'].result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      BRANCH: ${{ github.ref_name }}
      VOICE_APP_DIR: ${{ vars.VOICE_APP_DIR }}
    steps:
      - name: Restart the worker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VOICE_VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          envs: BRANCH,VOICE_APP_DIR
          script: |
            set -euo pipefail
            cd "$VOICE_APP_DIR"

            if [ "$BRANCH" = "main" ]; then SUFFIX=""; else SUFFIX="-dev"; fi
            if [ "$BRANCH" = "main" ]; then export CALLFLOW_ENV=production; else export CALLFLOW_ENV=dev; fi

            # One ecosystem.config.js describes all three processes; --only is
            # what makes this host run the worker and nothing else. The API's
            # entries are simply never selected here.
            pm2 startOrRestart "$VOICE_APP_DIR/ecosystem.config.js" \
              --only "callflow-voice$SUFFIX" --update-env

            pm2 save

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VOICE_VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 5m
          envs: BRANCH
          script: |
            set -euo pipefail
            if [ "$BRANCH" = "main" ]; then SUFFIX=""; else SUFFIX="-dev"; fi
            NAME="callflow-voice$SUFFIX"

            # There is no port to curl: this process dials out and serves
            # nothing. "Online" alone is not enough either - a crash-looping
            # worker is online for the moment pm2 samples it - so the uptime has
            # to have survived long enough to prove it got past its own config
            # check and the livekit-agents import.
            sleep 20
            pm2 jlist > /tmp/pm2-voice.json
            node -e '
              const name = process.argv[1];
              const proc = require("/tmp/pm2-voice.json").find((p) => p.name === name);
              if (!proc) {
                console.error(`FATAL: ${name} is not in the pm2 process list.`);
                process.exit(1);
              }
              const status = proc.pm2_env.status;
              const uptimeMs = Date.now() - proc.pm2_env.pm_uptime;
              if (status !== "online") {
                console.error(`FATAL: ${name} is ${status}, not online.`);
                process.exit(1);
              }
              if (uptimeMs < 10000) {
                console.error(`FATAL: ${name} restarted ${Math.round(uptimeMs / 1000)}s ago - it is crash-looping.`);
                process.exit(1);
              }
              console.log(`${name} is online, up ${Math.round(uptimeMs / 1000)}s.`);
            ' "$NAME" || { pm2 logs "$NAME" --lines 50 --nostream; exit 1; }
