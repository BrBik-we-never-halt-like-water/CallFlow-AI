name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: callflow-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check callflow tests
      - run: pytest -q

  frontend:
    name: Frontend lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://callflow-ai.brbik.com

  deploy:
    name: Deploy to VM
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/callflow-ai
            git pull
            .venv/bin/pip install -e .
            pm2 restart callflow-api

            cd web
            NEXT_PUBLIC_API_URL=https://callflow-ai.brbik.com npm ci
            NEXT_PUBLIC_API_URL=https://callflow-ai.brbik.com npm run build
            pm2 restart callflow-web

      - name: Health check
        run: |
          sleep 5
          curl -fsS https://callflow-ai.brbik.com/api/health
          curl -fsS -o /dev/null https://callflow-ai.brbik.com/
